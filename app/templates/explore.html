{% extends "base.html" %}
{% block title %}Realtor Data Explorer{% endblock %}
{% block tagline %}Realtor Data Explorer — full County + ZIP grids{% endblock %}

{% block extra_head %}
<style>
.explore-card { padding: 0; }
.explore-toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-glass);
    flex-wrap: wrap;
}
.tabs { display: flex; gap: 4px; padding: 4px; background: rgba(255,255,255,.03); border-radius: 10px; }
.tabs button {
    background: transparent; color: var(--text-secondary); border: none;
    padding: 6px 16px; font-size: .78rem; font-weight: 700; letter-spacing: .5px;
    border-radius: 8px; cursor: pointer; transition: all .15s;
}
.tabs button.active {
    background: linear-gradient(135deg, rgba(0,240,255,.18), rgba(124,58,237,.18));
    color: var(--accent-cyan);
    box-shadow: 0 0 12px rgba(0,240,255,.10);
}
.tabs button:hover:not(.active) { color: var(--text-primary); }

.search-box {
    flex: 1; min-width: 280px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border-glass);
    border-radius: 8px; padding: 8px 12px; color: var(--text-primary); font-size: .82rem;
}
.search-box:focus { outline: none; border-color: var(--accent-cyan); background: rgba(0,240,255,.04); }

.btn-tool {
    background: rgba(255,255,255,.05); color: var(--text-primary);
    border: 1px solid var(--border-glass); border-radius: 8px;
    padding: 7px 12px; font-size: .76rem; font-weight: 600; cursor: pointer;
    transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-tool:hover { background: rgba(0,240,255,.10); border-color: rgba(0,240,255,.30); color: var(--accent-cyan); }
.btn-tool .badge {
    background: rgba(0,240,255,.18); color: var(--accent-cyan);
    border-radius: 999px; padding: 1px 6px; font-size: .65rem; font-weight: 700;
}

.status-line {
    padding: 8px 16px; font-size: .72rem; color: var(--text-secondary);
    border-bottom: 1px solid var(--border-glass);
    display: flex; justify-content: space-between; align-items: center;
}

/* Grid container — fixed height, internal scroll for sticky header */
.grid-wrap {
    height: calc(100vh - 240px);
    overflow: auto;
    position: relative;
}
.grid-table {
    border-collapse: separate; border-spacing: 0;
    width: 100%;
    color: var(--text-primary);
    font-size: .8rem;
}
.grid-table thead th {
    position: sticky; top: 0; z-index: 5;
    background: rgba(8,8,20,0.98);
    backdrop-filter: blur(10px);
    color: var(--text-secondary);
    font-size: .65rem; text-transform: uppercase; letter-spacing: .8px;
    font-weight: 700; padding: 10px 12px;
    border-bottom: 1px solid var(--border-glass);
    text-align: left; user-select: none; white-space: nowrap;
}
.grid-table thead th .th-inner {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
.grid-table thead th:hover { color: var(--text-primary); background: rgba(12,12,28,1); }
.grid-table thead th.sorted .label { color: var(--accent-cyan); }
.grid-table thead th .sort-arrow { font-size: .6rem; opacity: .6; }
.grid-table thead th .filter-icon {
    cursor: pointer; opacity: .35; padding: 1px 4px; border-radius: 3px;
    font-size: .7rem; line-height: 1; margin-left: 2px;
    transition: all .12s;
}
.grid-table thead th .filter-icon:hover { opacity: .9; background: rgba(0,240,255,.10); color: var(--accent-cyan); }
.grid-table thead th .filter-icon.active { opacity: 1; color: var(--accent-cyan); background: rgba(0,240,255,.15); }

/* Filter popover */
#filter-popover {
    position: absolute; z-index: 100;
    min-width: 260px; max-width: 320px;
    background: rgba(8,8,20,0.98);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    display: none;
}
#filter-popover.open { display: block; }
#filter-popover h6 {
    margin: 0 0 12px; font-size: .78rem; font-weight: 700;
    color: var(--accent-cyan); letter-spacing: .5px;
}
#filter-popover .fp-row {
    display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
}
#filter-popover label.fp-lbl {
    font-size: .68rem; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .5px; min-width: 38px;
}
#filter-popover input[type="text"], #filter-popover input[type="number"] {
    flex: 1; background: rgba(255,255,255,.04);
    border: 1px solid var(--border-glass); border-radius: 6px;
    padding: 6px 9px; color: var(--text-primary); font-size: .82rem;
}
#filter-popover input:focus { outline: none; border-color: var(--accent-cyan); }
#filter-popover .fp-chips {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px;
}
#filter-popover .fp-chips button {
    background: rgba(255,255,255,.04); border: 1px solid var(--border-glass);
    color: var(--text-secondary); border-radius: 6px;
    padding: 4px 8px; font-size: .68rem; cursor: pointer;
}
#filter-popover .fp-chips button:hover { background: rgba(0,240,255,.10); color: var(--accent-cyan); border-color: rgba(0,240,255,.30); }
#filter-popover .fp-actions {
    display: flex; gap: 6px; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--border-glass);
}
#filter-popover .fp-actions button { flex: 1; }
#filter-popover .fp-toggle {
    color: var(--text-muted); font-size: .68rem; cursor: pointer;
    margin-top: 8px; user-select: none;
}
#filter-popover .fp-toggle:hover { color: var(--accent-cyan); }
#filter-popover .fp-shorthand { display: none; margin-top: 8px; }
#filter-popover.open-shorthand .fp-shorthand { display: block; }
#filter-popover .fp-help {
    font-size: .65rem; color: var(--text-muted); margin-top: 4px;
    line-height: 1.5;
}
#filter-popover .fp-multi-list {
    max-height: 220px; overflow-y: auto; padding: 4px 0;
    border: 1px solid var(--border-glass); border-radius: 6px;
}
#filter-popover .fp-multi-list label {
    display: flex; gap: 8px; padding: 5px 10px; cursor: pointer;
    font-size: .78rem; color: var(--text-primary);
}
#filter-popover .fp-multi-list label:hover { background: rgba(0,240,255,.06); }
#filter-popover .fp-multi-list label input { accent-color: var(--accent-cyan); }
#filter-popover .fp-radios {
    display: flex; gap: 6px; font-size: .68rem; color: var(--text-secondary);
    margin-top: 4px;
}
#filter-popover .fp-radios label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
#filter-popover .fp-radios input { accent-color: var(--accent-cyan); }

/* Active filter chip bar */
.chip-bar {
    padding: 8px 16px; border-bottom: 1px solid var(--border-glass);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.chip-bar:empty { display: none; }
.chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,240,255,.08); border: 1px solid rgba(0,240,255,.25);
    color: var(--accent-cyan); border-radius: 999px;
    padding: 3px 10px; font-size: .72rem; font-weight: 600;
}
.chip .chip-x {
    cursor: pointer; opacity: .65; font-size: .72rem;
    transition: opacity .1s;
}
.chip .chip-x:hover { opacity: 1; }
.chip-bar .clear-all {
    color: var(--text-muted); font-size: .68rem; cursor: pointer;
    margin-left: 6px; text-decoration: underline;
}
.chip-bar .clear-all:hover { color: var(--accent-red); }
.grid-table tbody td {
    border-bottom: 1px solid rgba(255,255,255,.025);
    padding: 8px 12px; white-space: nowrap;
}
.grid-table tbody tr:hover { background: rgba(0,240,255,.03); }
.grid-table tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
.grid-table tbody td.muted { color: var(--text-muted); }
.grid-table tbody td.pos { color: var(--accent-green); }
.grid-table tbody td.neg { color: var(--accent-red); }

.empty-state, .loading-state {
    padding: 40px; text-align: center; color: var(--text-muted); font-size: .85rem;
}

/* Column drawer */
#col-drawer {
    position: fixed; top: 52px; right: -360px;
    width: 360px; height: calc(100vh - 52px);
    background: rgba(8,8,20,0.96);
    border-left: 1px solid var(--border-glass);
    backdrop-filter: blur(20px);
    transition: right .25s ease; z-index: 50;
    display: flex; flex-direction: column;
}
#col-drawer.open { right: 0; }
#col-drawer .head {
    padding: 14px 18px; border-bottom: 1px solid var(--border-glass);
    display: flex; justify-content: space-between; align-items: center;
}
#col-drawer .head h6 { margin: 0; font-weight: 700; font-size: .9rem; }
#col-drawer .body { flex: 1; overflow-y: auto; padding: 8px 0; }
#col-drawer .col-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 18px; cursor: pointer; font-size: .8rem;
}
#col-drawer .col-row:hover { background: rgba(0,240,255,.04); }
#col-drawer .col-row input { accent-color: var(--accent-cyan); }
#col-drawer .col-row .src {
    margin-left: auto; font-size: .6rem; padding: 2px 6px; border-radius: 4px;
    background: rgba(255,255,255,.05); color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .5px;
}
#col-drawer .col-row .src.hot { background: rgba(236,72,153,.15); color: var(--accent-pink); }
#col-drawer .actions {
    padding: 12px 18px; border-top: 1px solid var(--border-glass);
    display: flex; gap: 8px;
}

#col-drawer-backdrop {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.4); z-index: 49; display: none;
}
#col-drawer-backdrop.open { display: block; }
</style>
{% endblock %}

{% block content %}
<div class="glass-card explore-card">
    <div class="explore-toolbar">
        <div class="tabs">
            <button id="tab-county" class="active" onclick="setGrain('county')">County</button>
            <button id="tab-zip" onclick="setGrain('zip')">ZIP</button>
        </div>
        <input type="search" class="search-box" id="search" placeholder="Search by FIPS / county / ZIP / city / state…" autocomplete="off">
        <button class="btn-tool" onclick="openColDrawer()">
            <i class="bi bi-layout-three-columns"></i>
            <span>Columns</span> <span class="badge" id="col-badge">7</span>
        </button>
        <button class="btn-tool" onclick="downloadCSV()">
            <i class="bi bi-download"></i> Download CSV
        </button>
    </div>
    <div class="chip-bar" id="chip-bar"></div>
    <div class="status-line">
        <span id="status-text">Loading…</span>
        <span id="status-meta" style="color: var(--text-muted);"></span>
    </div>
    <div class="grid-wrap" id="grid-wrap">
        <table class="grid-table" id="grid-table">
            <thead><tr id="grid-head"></tr></thead>
            <tbody id="grid-body">
                <tr><td colspan="100" class="loading-state">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="filter-popover"></div>

<div id="col-drawer-backdrop" onclick="closeColDrawer()"></div>
<div id="col-drawer">
    <div class="head">
        <h6>Show / Hide Columns</h6>
        <button class="btn-tool" onclick="closeColDrawer()" style="padding: 4px 10px;">✕</button>
    </div>
    <div class="body" id="col-list"></div>
    <div class="actions">
        <button class="btn-tool" style="flex:1;" onclick="setAllCols(true)">Show all</button>
        <button class="btn-tool" style="flex:1;" onclick="setAllCols(false)">Defaults only</button>
    </div>
</div>

<script>
// ─── State ─────────────────────────────────────────────────────────────────
let state = {
    grain:    'county',
    q:        '',
    sort:     'active_listing_count',
    dir:      'desc',
    columns:  [],            // full column metadata from server
    visible:  new Set(),     // keys currently shown
    rows:     [],            // accumulated rows
    total:    0,
    offset:   0,
    limit:    100,
    loading:  false,
    done:     false,
    filters:  [],            // column-level: [{col, op, value, ...}]
    fcFilters: [],           // foreclosure-record-level: [{field, op, value}]
    appliedFilters: [],      // server response (with resolved pct thresholds)
    appliedFcFilters: [],
};

// Multi-select columns (low-cardinality, fetched via /distinct/)
const MULTI_SELECT_COLS = new Set(['cbsa_title', 'quality_flag']);

// ─── Formatting ────────────────────────────────────────────────────────────
function fmt(val, type) {
    if (val === null || val === undefined || val === '') return '';
    if (type === 'currency') {
        const n = Number(val); if (!isFinite(n)) return val;
        return '$' + Math.round(n).toLocaleString();
    }
    if (type === 'integer') {
        const n = Number(val); if (!isFinite(n)) return val;
        return Math.round(n).toLocaleString();
    }
    if (type === 'ratio') {
        const n = Number(val); if (!isFinite(n)) return val;
        return (n * 100).toFixed(2) + '%';
    }
    if (type === 'percent_share') {
        const n = Number(val); if (!isFinite(n)) return val;
        return (n * 100).toFixed(1) + '%';
    }
    if (type === 'number') {
        const n = Number(val); if (!isFinite(n)) return val;
        return n.toFixed(2);
    }
    return val;
}
function cellClass(val, type) {
    const cls = [];
    if (val === null || val === undefined || val === '') { cls.push('muted'); return cls; }
    if (type === 'currency' || type === 'integer' || type === 'number'
        || type === 'ratio' || type === 'percent_share') cls.push('num');
    if (type === 'ratio' || type === 'percent_share') {
        const n = Number(val);
        if (isFinite(n)) {
            if (n > 0) cls.push('pos');
            else if (n < 0) cls.push('neg');
        }
    }
    return cls;
}

// ─── Rendering ─────────────────────────────────────────────────────────────
function renderHeader() {
    const tr = document.getElementById('grid-head');
    const cols = state.columns.filter(c => state.visible.has(c.key));
    tr.innerHTML = cols.map(c => {
        const sorted = c.key === state.sort;
        const arrow  = sorted ? (state.dir === 'asc' ? '▲' : '▼') : '';
        const hasFilter = state.filters.some(f => f.col === c.key)
            || (c.key === 'foreclosure_count' && state.fcFilters.length > 0);
        return `<th class="${sorted?'sorted':''}" data-key="${c.key}">
                  <span class="th-inner" onclick="sortBy('${c.key}')">
                    <span class="label">${c.label}</span>
                    <span class="sort-arrow">${arrow}</span>
                  </span>
                  <span class="filter-icon ${hasFilter?'active':''}"
                        title="Filter ${c.label}"
                        onclick="event.stopPropagation(); openFilter('${c.key}', this);">▾</span>
                </th>`;
    }).join('');
}

function renderRows() {
    const tbody = document.getElementById('grid-body');
    const cols = state.columns.filter(c => state.visible.has(c.key));
    if (!state.rows.length) {
        tbody.innerHTML = `<tr><td colspan="${cols.length}" class="empty-state">No results. Try clearing the search.</td></tr>`;
        return;
    }
    tbody.innerHTML = state.rows.map(r => {
        return '<tr>' + cols.map(c => {
            const v   = r[c.key];
            const cls = cellClass(v, c.type).join(' ');
            return `<td class="${cls}">${fmt(v, c.type)}</td>`;
        }).join('') + '</tr>';
    }).join('');
}

function updateStatus() {
    const shown = state.rows.length;
    const total = state.total.toLocaleString();
    const grain = state.grain === 'county' ? 'counties' : 'ZIPs';
    document.getElementById('status-text').textContent =
        state.loading ? `Loading…` : `Showing ${shown.toLocaleString()} of ${total} ${grain}`;
    const visible = state.columns.filter(c => state.visible.has(c.key)).length;
    document.getElementById('status-meta').textContent =
        `${visible} of ${state.columns.length} columns • Sort: ${state.sort} ${state.dir.toUpperCase()}`;
    document.getElementById('col-badge').textContent = visible;
}

// ─── Data fetching ─────────────────────────────────────────────────────────
function buildURL({format='json', offsetOverride=null} = {}) {
    const p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    p.set('sort',   state.sort);
    p.set('dir',    state.dir);
    p.set('limit',  state.limit);
    p.set('offset', offsetOverride !== null ? offsetOverride : state.offset);
    if (format !== 'json') p.set('format', format);
    if (format === 'csv') {
        const visible = state.columns.filter(c => state.visible.has(c.key)).map(c => c.key);
        p.set('cols', visible.join(','));
    }
    // Apply per-column filters
    for (const f of state.filters) {
        const v = Array.isArray(f.value) ? f.value.join(',') : f.value;
        p.append(`f.${f.col}.${f.op}`, v);
    }
    // Foreclosure-record-level filters
    for (const f of state.fcFilters) {
        const v = Array.isArray(f.value) ? f.value.join(',') : f.value;
        p.append(`fc.${f.field}.${f.op}`, v);
    }
    return `/api/explore/${state.grain}?${p.toString()}`;
}

// ─── URL persistence ───────────────────────────────────────────────────────
function syncURL() {
    const p = new URLSearchParams();
    p.set('grain', state.grain);
    if (state.q) p.set('q', state.q);
    if (state.sort !== 'active_listing_count') p.set('sort', state.sort);
    if (state.dir !== 'desc') p.set('dir', state.dir);
    for (const f of state.filters) {
        const v = Array.isArray(f.value) ? f.value.join(',') : f.value;
        p.append(`f.${f.col}.${f.op}`, v);
    }
    for (const f of state.fcFilters) {
        const v = Array.isArray(f.value) ? f.value.join(',') : f.value;
        p.append(`fc.${f.field}.${f.op}`, v);
    }
    history.replaceState(null, '', '/explore?' + p.toString());
}
function loadFromURL() {
    const p = new URLSearchParams(location.search);
    if (p.get('grain') === 'zip') state.grain = 'zip';
    state.q = p.get('q') || '';
    state.sort = p.get('sort') || 'active_listing_count';
    state.dir  = p.get('dir')  || 'desc';
    state.filters = [];
    state.fcFilters = [];
    for (const [k, v] of p.entries()) {
        if (k.startsWith('f.')) {
            const parts = k.split('.', 3);  // ["f", col, op]
            if (parts.length !== 3) continue;
            const [, col, op] = parts;
            const value = (op === 'in') ? v.split(',').filter(Boolean) : v;
            state.filters.push({ col, op, value });
        } else if (k.startsWith('fc.')) {
            const parts = k.split('.', 3);  // ["fc", field, op]
            if (parts.length !== 3) continue;
            const [, field, op] = parts;
            let value = v;
            if (op === 'in') value = v.split(',').filter(Boolean);
            else if (op === 'has') value = (v === 'true' || v === '1');
            state.fcFilters.push({ field, op, value });
        }
    }
    document.getElementById('search').value = state.q;
    document.getElementById('tab-county').classList.toggle('active', state.grain === 'county');
    document.getElementById('tab-zip').classList.toggle('active',    state.grain === 'zip');
}

async function loadInitial() {
    state.rows = []; state.offset = 0; state.done = false;
    state.loading = true; updateStatus();
    document.getElementById('grid-body').innerHTML =
        `<tr><td colspan="100" class="loading-state">Loading…</td></tr>`;
    try {
        const r = await fetch(buildURL());
        const d = await r.json();
        state.columns = d.columns;
        state.rows    = d.rows;
        state.total   = d.total;
        state.offset  = d.rows.length;
        state.appliedFilters   = d.applied_filters    || [];
        state.appliedFcFilters = d.applied_fc_filters || [];
        if (state.rows.length >= state.total) state.done = true;
        if (!state.visible.size) {
            state.columns.forEach(c => { if (c.default) state.visible.add(c.key); });
            renderColDrawer();
        }
    } catch (e) {
        document.getElementById('grid-body').innerHTML =
            `<tr><td colspan="100" class="empty-state">Error loading data: ${e.message}</td></tr>`;
        state.loading = false; updateStatus();
        return;
    }
    state.loading = false;
    renderHeader(); renderRows(); renderChips(); updateStatus();
    syncURL();
}

async function loadMore() {
    if (state.loading || state.done) return;
    state.loading = true; updateStatus();
    try {
        const r = await fetch(buildURL());
        const d = await r.json();
        state.rows = state.rows.concat(d.rows);
        state.offset = state.rows.length;
        if (state.rows.length >= state.total) state.done = true;
    } catch (e) {
        console.warn(e);
    }
    state.loading = false;
    renderRows(); updateStatus();
}

// ─── Interactions ──────────────────────────────────────────────────────────
function setGrain(g) {
    if (g === state.grain) return;
    state.grain = g;
    state.q = '';
    state.sort = 'active_listing_count';
    state.dir  = 'desc';
    state.visible = new Set();   // forces re-default from columns
    document.getElementById('search').value = '';
    document.getElementById('tab-county').classList.toggle('active', g === 'county');
    document.getElementById('tab-zip').classList.toggle('active', g === 'zip');
    loadInitial();
}

function sortBy(key) {
    if (state.sort === key) {
        state.dir = state.dir === 'desc' ? 'asc' : 'desc';
    } else {
        state.sort = key;
        state.dir = 'desc';
    }
    loadInitial();
}

let _qTimer = null;
document.getElementById('search').addEventListener('input', (e) => {
    state.q = e.target.value;
    clearTimeout(_qTimer);
    _qTimer = setTimeout(loadInitial, 250);
});

// Scroll → load more
document.getElementById('grid-wrap').addEventListener('scroll', (e) => {
    const el = e.target;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 100) {
        loadMore();
    }
});

// Column drawer
function openColDrawer() {
    document.getElementById('col-drawer').classList.add('open');
    document.getElementById('col-drawer-backdrop').classList.add('open');
}
function closeColDrawer() {
    document.getElementById('col-drawer').classList.remove('open');
    document.getElementById('col-drawer-backdrop').classList.remove('open');
}
function renderColDrawer() {
    const list = document.getElementById('col-list');
    list.innerHTML = state.columns.map(c => {
        const checked = state.visible.has(c.key) ? 'checked' : '';
        const srcClass = c.source === 'hot' ? 'src hot' : 'src';
        return `<label class="col-row">
                  <input type="checkbox" ${checked} onchange="toggleCol('${c.key}', this.checked)">
                  <span>${c.label}</span>
                  <span class="${srcClass}">${c.source}</span>
                </label>`;
    }).join('');
}
function toggleCol(key, on) {
    if (on) state.visible.add(key); else state.visible.delete(key);
    renderHeader(); renderRows(); updateStatus();
}
function setAllCols(showAll) {
    state.visible = new Set();
    state.columns.forEach(c => {
        if (showAll || c.default) state.visible.add(c.key);
    });
    renderColDrawer(); renderHeader(); renderRows(); updateStatus();
}

// CSV download
function downloadCSV() {
    const url = buildURL({format: 'csv'});
    window.location.href = url;
}

// ─── Filter chips ──────────────────────────────────────────────────────────
function chipLabel(f, c) {
    const meta = state.columns.find(cc => cc.key === f.col);
    const cl   = meta ? meta.label : f.col;
    const t    = meta ? meta.type  : 'text';
    let val = f.value;
    if (Array.isArray(val)) val = val.join(', ');
    let opStr;
    if (f.pct_resolved_from) {
        const lbl = {t10:'Top 10%', t25:'Top 25%', b25:'Bottom 25%', b10:'Bottom 10%'}[f.pct_resolved_from];
        return `${cl}: ${lbl} (≥ ${formatNum(f.pct_threshold, t)})`;
    }
    switch (f.op) {
        case 'gte':      opStr = `≥ ${formatNum(val, t)}`; break;
        case 'gt':       opStr = `> ${formatNum(val, t)}`; break;
        case 'lte':      opStr = `≤ ${formatNum(val, t)}`; break;
        case 'lt':       opStr = `< ${formatNum(val, t)}`; break;
        case 'eq':       opStr = `= ${formatNum(val, t)}`; break;
        case 'ne':       opStr = `≠ ${formatNum(val, t)}`; break;
        case 'contains': opStr = `contains "${val}"`; break;
        case 'starts':   opStr = `starts with "${val}"`; break;
        case 'equals':   opStr = `= "${val}"`; break;
        case 'in':       opStr = `in {${val}}`; break;
        default:         opStr = `${f.op} ${val}`;
    }
    return `${cl} ${opStr}`;
}
function formatNum(v, type) {
    if (v === null || v === undefined || v === '') return v;
    const n = Number(v);
    if (!isFinite(n)) return v;
    if (type === 'currency')      return '$' + Math.round(n).toLocaleString();
    if (type === 'integer')       return Math.round(n).toLocaleString();
    if (type === 'ratio' || type === 'percent_share') return (n * 100).toFixed(2) + '%';
    if (type === 'number')        return n.toFixed(2);
    return v;
}
function fcChipLabel(f) {
    if (f.field === 'auction_date') {
        if (f.op === 'has')      return 'Auction date: ' + (f.value ? 'with date' : 'no date');
        if (f.op === 'gte')      return `Auction date ≥ ${f.value}`;
        if (f.op === 'lte')      return `Auction date ≤ ${f.value}`;
        if (f.op === 'eq')       return `Auction date = ${f.value}`;
    }
    if (f.field === 'listing_type')   return `Listing type: ${Array.isArray(f.value)?f.value.join(', '):f.value}`;
    if (f.field === 'classification') return `Classification: ${Array.isArray(f.value)?f.value.join(', '):f.value}`;
    return `${f.field} ${f.op} ${f.value}`;
}
function renderChips() {
    const bar = document.getElementById('chip-bar');
    const chips = [];
    state.appliedFilters.forEach((f, i) => {
        chips.push(`<span class="chip">${chipLabel(f, null)}<span class="chip-x" title="Remove" onclick="removeFilter(${i})">✕</span></span>`);
    });
    state.appliedFcFilters.forEach((f, i) => {
        chips.push(`<span class="chip">${fcChipLabel(f)}<span class="chip-x" title="Remove" onclick="removeFcFilter(${i})">✕</span></span>`);
    });
    if (!chips.length) { bar.innerHTML = ''; return; }
    bar.innerHTML = chips.join('') + `<span class="clear-all" onclick="clearAllFilters()">Clear all</span>`;
}
function removeFcFilter(idx) {
    const af = state.appliedFcFilters.slice();
    af.splice(idx, 1);
    state.fcFilters = af.map(f => ({ field: f.field, op: f.op, value: f.value }));
    loadInitial();
}
function removeFilter(idx) {
    // appliedFilters is the resolved list from the server; we need to map back to
    // state.filters by (col, op or pct_resolved_from). Simpler: rebuild state.filters
    // from appliedFilters minus the removed one, treating pct as the original op.
    const af = state.appliedFilters.slice();
    af.splice(idx, 1);
    state.filters = af.map(f => f.pct_resolved_from
        ? { col: f.col, op: 'pct', value: f.pct_resolved_from }
        : { col: f.col, op: f.op, value: f.value });
    loadInitial();
}
function clearAllFilters() {
    state.filters = []; state.fcFilters = []; loadInitial();
}

// Add or replace a filter for a (col, op) key. For numeric ranges we may have
// both gte and lte at once — they share col but different op, so they coexist.
function setFilter(col, op, value) {
    const isPct = op === 'pct';
    state.filters = state.filters.filter(f => {
        if (f.col !== col) return true;
        // Replace any existing pct filter on this col regardless of op
        if (isPct || f.op === 'pct') return false;
        return f.op !== op;
    });
    if (value !== '' && value !== null && value !== undefined &&
        !(Array.isArray(value) && value.length === 0)) {
        state.filters.push({ col, op, value });
    }
    loadInitial();
}
function clearFilterForCol(col) {
    state.filters = state.filters.filter(f => f.col !== col);
    loadInitial();
}

// ─── Filter popover ────────────────────────────────────────────────────────
let _popoverCol = null;
function openFilter(col, anchor) {
    const meta = state.columns.find(c => c.key === col);
    if (!meta) return;
    const pop = document.getElementById('filter-popover');
    _popoverCol = col;
    pop.classList.remove('open-shorthand');

    // Special popover for the Foreclosures column — count range PLUS
    // record-level filters that re-aggregate the count.
    if (col === 'foreclosure_count') {
        return openForeclosurePopover(anchor);
    }

    // Existing filter values for this column
    const fGte  = state.filters.find(f => f.col === col && f.op === 'gte');
    const fLte  = state.filters.find(f => f.col === col && f.op === 'lte');
    const fGt   = state.filters.find(f => f.col === col && f.op === 'gt');
    const fLt   = state.filters.find(f => f.col === col && f.op === 'lt');
    const fEq   = state.filters.find(f => f.col === col && f.op === 'eq');
    const fCont = state.filters.find(f => f.col === col && f.op === 'contains');
    const fStarts = state.filters.find(f => f.col === col && f.op === 'starts');
    const fEqT  = state.filters.find(f => f.col === col && f.op === 'equals');
    const fIn   = state.filters.find(f => f.col === col && f.op === 'in');

    let html = `<h6>${meta.label}</h6>`;

    const isMulti = MULTI_SELECT_COLS.has(col);
    const numericTypes = ['integer','currency','ratio','percent_share','number'];

    if (isMulti) {
        html += `<div class="fp-multi-list" id="fp-multi"><div style="padding:10px;color:var(--text-muted);font-size:.72rem">Loading values…</div></div>`;
        html += `<div class="fp-actions">
                   <button class="btn-tool" onclick="applyMulti()">Apply</button>
                   <button class="btn-tool" onclick="clearFilterForCol('${col}'); closeFilter();">Clear</button>
                 </div>`;
    } else if (numericTypes.includes(meta.type)) {
        const isPct = meta.type === 'ratio' || meta.type === 'percent_share';
        const minVal = fGte ? (isPct ? (fGte.value*100) : fGte.value) : '';
        const maxVal = fLte ? (isPct ? (fLte.value*100) : fLte.value) : '';
        const unit = isPct ? '%' : '';
        html += `<div class="fp-row">
                   <label class="fp-lbl">Min${unit ? ' ('+unit+')' : ''}</label>
                   <input id="fp-min" type="number" step="any" placeholder="" value="${minVal}">
                 </div>
                 <div class="fp-row">
                   <label class="fp-lbl">Max${unit ? ' ('+unit+')' : ''}</label>
                   <input id="fp-max" type="number" step="any" placeholder="" value="${maxVal}">
                 </div>
                 <div class="fp-chips">
                   <button onclick="applyPct('t10')">Top 10%</button>
                   <button onclick="applyPct('t25')">Top 25%</button>
                   <button onclick="applyPct('b25')">Bottom 25%</button>
                   <button onclick="applyPct('b10')">Bottom 10%</button>
                 </div>
                 <div class="fp-toggle" onclick="toggleShorthand()">⌄ Power-user: shorthand syntax</div>
                 <div class="fp-shorthand">
                   <input id="fp-short" type="text" placeholder="e.g.  >=1000   100-500   <50">
                   <div class="fp-help">Examples: <code>1000-5000</code> · <code>&gt;=1000</code> · <code>&lt;500</code> · <code>1000+</code></div>
                 </div>
                 <div class="fp-actions">
                   <button class="btn-tool" onclick="applyNumeric()">Apply</button>
                   <button class="btn-tool" onclick="clearFilterForCol('${col}'); closeFilter();">Clear</button>
                 </div>`;
    } else {
        // text
        const cVal = fCont ? fCont.value : '';
        const sVal = fStarts ? fStarts.value : '';
        const eVal = fEqT ? fEqT.value : '';
        const op = fStarts ? 'starts' : (fEqT ? 'equals' : 'contains');
        const val = sVal || eVal || cVal;
        html += `<div class="fp-row">
                   <input id="fp-text" type="text" placeholder="Type to filter…" value="${val.replace(/"/g,'&quot;')}">
                 </div>
                 <div class="fp-radios">
                   <label><input type="radio" name="textOp" value="contains" ${op==='contains'?'checked':''}> Contains</label>
                   <label><input type="radio" name="textOp" value="starts" ${op==='starts'?'checked':''}> Starts with</label>
                   <label><input type="radio" name="textOp" value="equals" ${op==='equals'?'checked':''}> Equals</label>
                 </div>
                 <div class="fp-actions">
                   <button class="btn-tool" onclick="applyText()">Apply</button>
                   <button class="btn-tool" onclick="clearFilterForCol('${col}'); closeFilter();">Clear</button>
                 </div>`;
    }
    pop.innerHTML = html;
    positionPopover(anchor);
    pop.classList.add('open');

    if (isMulti) loadMultiOptions(col);

    // Auto-focus first input
    setTimeout(() => {
        const firstInput = pop.querySelector('input[type="text"], input[type="number"]');
        if (firstInput) firstInput.focus();
    }, 30);
}
function openForeclosurePopover(anchor) {
    const pop = document.getElementById('filter-popover');
    // Count range — reuse state.filters[col=foreclosure_count]
    const fGte = state.filters.find(f => f.col === 'foreclosure_count' && f.op === 'gte');
    const fLte = state.filters.find(f => f.col === 'foreclosure_count' && f.op === 'lte');
    // Auction date current state
    const fcHas  = state.fcFilters.find(f => f.field === 'auction_date' && f.op === 'has');
    const fcGte  = state.fcFilters.find(f => f.field === 'auction_date' && f.op === 'gte');
    const fcLte  = state.fcFilters.find(f => f.field === 'auction_date' && f.op === 'lte');
    const fcLt   = state.fcFilters.find(f => f.field === 'listing_type' && f.op === 'in');
    const fcCl   = state.fcFilters.find(f => f.field === 'classification' && f.op === 'in');
    const hasYes = !!(fcHas && fcHas.value === true);
    const hasNo  = !!(fcHas && fcHas.value === false);

    pop.style.minWidth = '320px';
    pop.style.maxWidth = '420px';
    pop.innerHTML = `
      <h6>Foreclosures</h6>

      <div style="font-size:.68rem; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px;">Count range</div>
      <div class="fp-row">
        <label class="fp-lbl">Min</label>
        <input id="fc-min" type="number" step="any" placeholder="" value="${fGte ? fGte.value : ''}">
      </div>
      <div class="fp-row">
        <label class="fp-lbl">Max</label>
        <input id="fc-max" type="number" step="any" placeholder="" value="${fLte ? fLte.value : ''}">
      </div>
      <div class="fp-chips">
        <button onclick="applyPctFc('t10')">Top 10%</button>
        <button onclick="applyPctFc('t25')">Top 25%</button>
        <button onclick="applyPctFc('b25')">Bottom 25%</button>
      </div>

      <div style="height:10px;"></div>
      <div style="font-size:.68rem; color:var(--text-muted); margin:8px 0 6px; text-transform:uppercase; letter-spacing:.5px;">Auction date</div>
      <label class="col-row" style="padding:4px 0; display:flex; gap:8px; cursor:pointer;">
        <input type="checkbox" id="fc-has-yes" ${hasYes?'checked':''}>
        <span>With auction date</span>
      </label>
      <label class="col-row" style="padding:4px 0; display:flex; gap:8px; cursor:pointer;">
        <input type="checkbox" id="fc-has-no"  ${hasNo?'checked':''}>
        <span>Without auction date</span>
      </label>
      <div class="fp-row" style="margin-top:6px;">
        <label class="fp-lbl">From</label>
        <input id="fc-date-from" type="date" value="${fcGte ? fcGte.value : ''}">
      </div>
      <div class="fp-row">
        <label class="fp-lbl">To</label>
        <input id="fc-date-to"   type="date" value="${fcLte ? fcLte.value : ''}">
      </div>

      <div style="height:10px;"></div>
      <div style="font-size:.68rem; color:var(--text-muted); margin:8px 0 6px; text-transform:uppercase; letter-spacing:.5px;">Listing type</div>
      <div class="fp-multi-list" id="fc-lt-list">
        <div style="padding:10px;color:var(--text-muted);font-size:.72rem;">Loading…</div>
      </div>

      <div style="height:10px;"></div>
      <div style="font-size:.68rem; color:var(--text-muted); margin:8px 0 6px; text-transform:uppercase; letter-spacing:.5px;">Classification</div>
      <div class="fp-multi-list" id="fc-cl-list">
        <div style="padding:10px;color:var(--text-muted);font-size:.72rem;">Loading…</div>
      </div>

      <div class="fp-actions">
        <button class="btn-tool" onclick="applyForeclosureFilter()">Apply</button>
        <button class="btn-tool" onclick="clearForeclosureFilter();">Clear all</button>
      </div>
    `;
    positionPopover(anchor);
    pop.classList.add('open');
    pop.style.maxHeight = (window.innerHeight - 100) + 'px';
    pop.style.overflowY = 'auto';

    // Load distinct values for listing_type + classification
    loadFcDistinct('listing_type',   'fc-lt-list', fcLt ? fcLt.value : []);
    loadFcDistinct('classification', 'fc-cl-list', fcCl ? fcCl.value : []);
}

async function loadFcDistinct(field, listId, checkedValues) {
    try {
        const r = await fetch(`/api/explore/foreclosure-distinct/${field}`);
        const d = await r.json();
        const checked = new Set((checkedValues || []).map(String));
        const list = document.getElementById(listId);
        if (!list) return;
        list.innerHTML = (d.values || []).map(item => {
            const v = item.value;
            const safe = String(v).replace(/"/g,'&quot;');
            return `<label><input type="checkbox" value="${safe}" ${checked.has(String(v))?'checked':''}> ${v} <span style="margin-left:auto;color:var(--text-muted);font-size:.65rem;">${item.count.toLocaleString()}</span></label>`;
        }).join('') || `<div style="padding:10px;color:var(--text-muted)">No values.</div>`;
    } catch (e) {
        const list = document.getElementById(listId);
        if (list) list.innerHTML = `<div style="padding:10px;color:var(--accent-red);font-size:.72rem">Failed to load: ${e.message}</div>`;
    }
}

function applyPctFc(which) {
    setFilter('foreclosure_count', 'pct', which);
    closeFilter();
}

function applyForeclosureFilter() {
    // 1. Count range — reuse the column-filter slot
    const minRaw = document.getElementById('fc-min').value.trim();
    const maxRaw = document.getElementById('fc-max').value.trim();
    state.filters = state.filters.filter(f => f.col !== 'foreclosure_count');
    if (minRaw !== '' && isFinite(Number(minRaw))) {
        state.filters.push({ col: 'foreclosure_count', op: 'gte', value: Number(minRaw) });
    }
    if (maxRaw !== '' && isFinite(Number(maxRaw))) {
        state.filters.push({ col: 'foreclosure_count', op: 'lte', value: Number(maxRaw) });
    }

    // 2. Foreclosure-record-level filters (auction_date / listing_type / classification)
    state.fcFilters = [];

    const hasYes = document.getElementById('fc-has-yes').checked;
    const hasNo  = document.getElementById('fc-has-no').checked;
    // Both checked = no constraint (both are valid). Only one checked applies it.
    if (hasYes && !hasNo) state.fcFilters.push({ field: 'auction_date', op: 'has', value: true });
    if (hasNo  && !hasYes) state.fcFilters.push({ field: 'auction_date', op: 'has', value: false });

    const dateFrom = document.getElementById('fc-date-from').value;
    const dateTo   = document.getElementById('fc-date-to').value;
    if (dateFrom) state.fcFilters.push({ field: 'auction_date', op: 'gte', value: dateFrom });
    if (dateTo)   state.fcFilters.push({ field: 'auction_date', op: 'lte', value: dateTo });

    const ltChecked = Array.from(document.querySelectorAll('#fc-lt-list input[type="checkbox"]:checked')).map(el => el.value);
    if (ltChecked.length) state.fcFilters.push({ field: 'listing_type',   op: 'in', value: ltChecked });

    const clChecked = Array.from(document.querySelectorAll('#fc-cl-list input[type="checkbox"]:checked')).map(el => el.value);
    if (clChecked.length) state.fcFilters.push({ field: 'classification', op: 'in', value: clChecked });

    closeFilter();
    loadInitial();
}

function clearForeclosureFilter() {
    state.filters = state.filters.filter(f => f.col !== 'foreclosure_count');
    state.fcFilters = [];
    closeFilter();
    loadInitial();
}

function positionPopover(anchor) {
    const pop = document.getElementById('filter-popover');
    const r   = anchor.getBoundingClientRect();
    pop.style.top  = (window.scrollY + r.bottom + 4) + 'px';
    // Right-align if it would overflow the viewport
    const popW = pop.offsetWidth || 280;
    let left   = window.scrollX + r.left;
    if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 16;
    pop.style.left = Math.max(8, left) + 'px';
}
function closeFilter() {
    document.getElementById('filter-popover').classList.remove('open');
    _popoverCol = null;
}
document.addEventListener('click', (e) => {
    const pop = document.getElementById('filter-popover');
    if (!pop.classList.contains('open')) return;
    if (pop.contains(e.target)) return;
    if (e.target.classList.contains('filter-icon')) return;
    closeFilter();
});

function toggleShorthand() {
    document.getElementById('filter-popover').classList.toggle('open-shorthand');
}

// ─── Apply handlers ────────────────────────────────────────────────────────
function applyNumeric() {
    if (!_popoverCol) return;
    const meta = state.columns.find(c => c.key === _popoverCol);
    const isPct = meta.type === 'ratio' || meta.type === 'percent_share';
    const minRaw = document.getElementById('fp-min').value.trim();
    const maxRaw = document.getElementById('fp-max').value.trim();
    const shortRaw = (document.getElementById('fp-short') || {}).value || '';

    // Clear any existing numeric filters on this column first (server side will replace)
    state.filters = state.filters.filter(f => f.col !== _popoverCol);

    // Shorthand takes precedence if non-empty
    if (shortRaw.trim()) {
        const parsed = parseShorthand(shortRaw.trim());
        for (const f of parsed) {
            const v = isPct ? (f.value / 100) : f.value;
            state.filters.push({ col: _popoverCol, op: f.op, value: v });
        }
    } else {
        if (minRaw !== '') {
            const v = isPct ? (Number(minRaw) / 100) : Number(minRaw);
            if (isFinite(v)) state.filters.push({ col: _popoverCol, op: 'gte', value: v });
        }
        if (maxRaw !== '') {
            const v = isPct ? (Number(maxRaw) / 100) : Number(maxRaw);
            if (isFinite(v)) state.filters.push({ col: _popoverCol, op: 'lte', value: v });
        }
    }
    closeFilter();
    loadInitial();
}
function applyPct(which) {
    if (!_popoverCol) return;
    setFilter(_popoverCol, 'pct', which);
    closeFilter();
}
function applyText() {
    if (!_popoverCol) return;
    const op  = (document.querySelector('input[name="textOp"]:checked') || {}).value || 'contains';
    const val = document.getElementById('fp-text').value;
    state.filters = state.filters.filter(f => f.col !== _popoverCol);
    if (val) state.filters.push({ col: _popoverCol, op, value: val });
    closeFilter();
    loadInitial();
}
function applyMulti() {
    if (!_popoverCol) return;
    const checked = Array.from(document.querySelectorAll('#fp-multi input[type="checkbox"]:checked'))
        .map(el => el.value);
    state.filters = state.filters.filter(f => f.col !== _popoverCol);
    if (checked.length) state.filters.push({ col: _popoverCol, op: 'in', value: checked });
    closeFilter();
    loadInitial();
}
async function loadMultiOptions(col) {
    try {
        const r = await fetch(`/api/explore/${state.grain}/distinct/${col}`);
        const d = await r.json();
        const existing = state.filters.find(f => f.col === col && f.op === 'in');
        const checked  = new Set(existing ? existing.value : []);
        const list = document.getElementById('fp-multi');
        if (!list) return;
        list.innerHTML = (d.values || []).map(v => {
            const safe = String(v).replace(/"/g,'&quot;');
            return `<label><input type="checkbox" value="${safe}" ${checked.has(String(v))?'checked':''}> ${v}</label>`;
        }).join('') || `<div style="padding:10px;color:var(--text-muted)">No values.</div>`;
    } catch (e) {
        const list = document.getElementById('fp-multi');
        if (list) list.innerHTML = `<div style="padding:10px;color:var(--accent-red);font-size:.72rem">Failed to load: ${e.message}</div>`;
    }
}

// Parse shorthand like ">=1000", "<500", "100-500", "1000+", "1000".
function parseShorthand(s) {
    s = s.trim();
    if (!s) return [];
    let m;
    if ((m = s.match(/^>=\s*(-?[\d.]+)$/)))      return [{op:'gte', value: Number(m[1])}];
    if ((m = s.match(/^>\s*(-?[\d.]+)$/)))       return [{op:'gt',  value: Number(m[1])}];
    if ((m = s.match(/^<=\s*(-?[\d.]+)$/)))      return [{op:'lte', value: Number(m[1])}];
    if ((m = s.match(/^<\s*(-?[\d.]+)$/)))       return [{op:'lt',  value: Number(m[1])}];
    if ((m = s.match(/^(-?[\d.]+)\+$/)))         return [{op:'gte', value: Number(m[1])}];
    if ((m = s.match(/^(-?[\d.]+)\s*-\s*(-?[\d.]+)$/))) {
        return [{op:'gte', value: Number(m[1])}, {op:'lte', value: Number(m[2])}];
    }
    if ((m = s.match(/^=?\s*(-?[\d.]+)$/)))      return [{op:'eq',  value: Number(m[1])}];
    return [];  // unparseable → ignored
}

// ─── Boot ──────────────────────────────────────────────────────────────────
loadFromURL();
loadInitial();

// Hide topbar status pills (those are dashboard-specific; not relevant here)
['ds-realtor','ds-zillow','ds-census'].forEach(id => {
    const el = document.getElementById(id); if (el) el.style.display = 'none';
});
